openapi: 3.1.0
info:
  title: Rabit API
  version: 1.0.0-mvp
  description: |
    Contract-first MVP API (ADR-0010). Rules in api-guidelines.md.
    Operations marked `x-rabit-status: planned` are reserved and not implemented in MVP.
servers:
  - url: http://localhost:8080
    description: Local api (control plane)
  - url: http://localhost:8081
    description: Local media gateway (data plane)
security:
  - bearer: []
tags:
  - name: account
  - name: uploads
  - name: audio
  - name: audio-logs
  - name: playback
  - name: catalog
  - name: library
  - name: playlists
  - name: collection
    description: Physical Collection, manual registration (COL-001/002/007). A record of ownership, never a playback right (COL-003).
  - name: exports
  - name: entitlements
  - name: commerce
    description: Album purchase (ADR-0018, provisional; sandbox provider only)
  - name: dig
  - name: search
  - name: integrity
  - name: ops
  - name: media
  - name: system

paths:
  /healthz:
    get:
      tags: [system]
      operationId: healthz
      security: []
      responses:
        '200': { description: Process is alive, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
  /readyz:
    get:
      tags: [system]
      operationId: readyz
      security: []
      responses:
        '200': { description: Dependencies reachable, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
        '503': { description: Not ready, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }

  /v1/me:
    get:
      tags: [account]
      operationId: getMe
      responses:
        '200': { description: Current account, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      tags: [account]
      operationId: requestAccountDeletion
      description: Starts asynchronous deletion of the account and all owned content. New access is blocked immediately.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '202': { description: Deletion accepted, content: { application/json: { schema: { $ref: '#/components/schemas/AccountDeletion' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/uploads:
    post:
      tags: [uploads]
      operationId: createUpload
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateUploadRequest' } } }
      responses:
        '201': { description: Upload intent, content: { application/json: { schema: { $ref: '#/components/schemas/UploadIntent' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/uploads/{upload_id}:
    parameters: [ { $ref: '#/components/parameters/UploadId' } ]
    get:
      tags: [uploads]
      operationId: getUpload
      responses:
        '200': { description: Upload status, content: { application/json: { schema: { $ref: '#/components/schemas/Upload' } } } }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [uploads]
      operationId: cancelUpload
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/Upload' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/uploads/{upload_id}/finalize:
    parameters: [ { $ref: '#/components/parameters/UploadId' } ]
    post:
      tags: [uploads]
      operationId: finalizeUpload
      parameters: [ { $ref: '#/components/parameters/IdempotencyKeyRequired' } ]
      responses:
        '202': { description: Bytes verified; processing queued, content: { application/json: { schema: { $ref: '#/components/schemas/Upload' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/audio-sources:
    get:
      tags: [audio]
      operationId: listAudioSources
      parameters:
        - { name: origin, in: query, schema: { type: string, enum: [private_upload, audio_log] } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Caller's own sources, content: { application/json: { schema: { $ref: '#/components/schemas/AudioSourcePage' } } } }
  /v1/audio-sources/{audio_source_id}:
    parameters: [ { $ref: '#/components/parameters/AudioSourceId' } ]
    get:
      tags: [audio]
      operationId: getAudioSource
      responses:
        '200': { description: Source, content: { application/json: { schema: { $ref: '#/components/schemas/AudioSource' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [audio]
      operationId: updateAudioSource
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateAudioSourceRequest' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/AudioSource' } } } }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [audio]
      operationId: deleteAudioSource
      responses:
        '202': { description: Deletion accepted; access blocked immediately, content: { application/json: { schema: { $ref: '#/components/schemas/AudioSource' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/audio-sources/{audio_source_id}/waveform:
    parameters: [ { $ref: '#/components/parameters/AudioSourceId' } ]
    get:
      tags: [audio]
      operationId: getWaveform
      responses:
        '200': { description: Waveform peaks, content: { application/json: { schema: { $ref: '#/components/schemas/Waveform' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/audio-logs:
    get:
      tags: [audio-logs]
      operationId: listAudioLogs
      parameters: [ { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: Caller's audio logs, content: { application/json: { schema: { $ref: '#/components/schemas/AudioLogPage' } } } }
    post:
      tags: [audio-logs]
      operationId: createAudioLog
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateAudioLogRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AudioLog' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/audio-logs/{audio_log_id}:
    parameters: [ { name: audio_log_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    get:
      tags: [audio-logs]
      operationId: getAudioLog
      responses:
        '200': { description: Audio log, content: { application/json: { schema: { $ref: '#/components/schemas/AudioLog' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [audio-logs]
      operationId: updateAudioLog
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateAudioLogRequest' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/AudioLog' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/playback-sessions:
    post:
      tags: [playback]
      operationId: createPlaybackSession
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreatePlaybackSessionRequest' } } }
      responses:
        '201': { description: Session issued, content: { application/json: { schema: { $ref: '#/components/schemas/PlaybackSession' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/playback-sessions/{session_id}/refresh:
    parameters: [ { name: session_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    post:
      tags: [playback]
      operationId: refreshPlaybackSession
      responses:
        '200': { description: Refreshed (policy re-evaluated), content: { application/json: { schema: { $ref: '#/components/schemas/PlaybackSession' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/listening-events/batch:
    post:
      tags: [playback]
      operationId: submitListeningEvents
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ListeningEventBatch' } } }
      responses:
        '202': { description: Accepted for processing, content: { application/json: { schema: { $ref: '#/components/schemas/ListeningEventBatchResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1/recordings/{recording_id}:
    parameters: [ { name: recording_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    get:
      tags: [catalog]
      operationId: getRecording
      responses:
        '200': { description: Recording, content: { application/json: { schema: { $ref: '#/components/schemas/Recording' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/recordings/{recording_id}/passport:
    parameters: [ { name: recording_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    get:
      tags: [integrity]
      operationId: getPassport
      responses:
        '200': { description: Music Passport, content: { application/json: { schema: { $ref: '#/components/schemas/Passport' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/releases/{release_id}:
    parameters: [ { name: release_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    get:
      tags: [catalog]
      operationId: getRelease
      responses:
        '200': { description: Release with tracks and per-track playability, content: { application/json: { schema: { $ref: '#/components/schemas/Release' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/entities/{entity_id}:
    parameters: [ { $ref: '#/components/parameters/EntityId' } ]
    get:
      tags: [catalog]
      operationId: getEntity
      responses:
        '200': { description: Music entity summary, content: { application/json: { schema: { $ref: '#/components/schemas/EntitySummary' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /v1/library:
    get:
      tags: [library]
      operationId: listLibrary
      parameters:
        - { name: ref_type, in: query, schema: { $ref: '#/components/schemas/LibraryRefType' } }
        - { name: ref_id, in: query, description: "Only the caller's entry for this recording, release or audio source (empty page if not saved)", schema: { $ref: '#/components/schemas/Id' } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Library items with availability, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryPage' } } } }
    post:
      tags: [library]
      operationId: addLibraryItem
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddLibraryItemRequest' } } }
      responses:
        '201': { description: Added, content: { application/json: { schema: { $ref: '#/components/schemas/LibraryItem' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/library/{library_item_id}:
    parameters: [ { name: library_item_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    delete:
      tags: [library]
      operationId: removeLibraryItem
      responses:
        '204': { description: Removed (never revokes entitlements) }
        '404': { $ref: '#/components/responses/Error' }

  /v1/physical-items:
    get:
      tags: [collection]
      operationId: listPhysicalItems
      parameters: [ { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: "The caller's physical items, newest first", content: { application/json: { schema: { $ref: '#/components/schemas/PhysicalItemPage' } } } }
        '400': { $ref: '#/components/responses/Error' }
    post:
      tags: [collection]
      operationId: createPhysicalItem
      description: >-
        Records that the caller owns a CD, LP, cassette or other physical copy. The item is
        `self_declared`; it is not proof of copyright and never creates an entitlement (COL-003).
        Rate limited (120 per hour).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreatePhysicalItemRequest' } } }
      responses:
        '201': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/PhysicalItem' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /v1/physical-items/{physical_item_id}:
    parameters: [ { name: physical_item_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    get:
      tags: [collection]
      operationId: getPhysicalItem
      responses:
        '200': { description: The item, content: { application/json: { schema: { $ref: '#/components/schemas/PhysicalItem' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [collection]
      operationId: updatePhysicalItem
      description: Changes the given fields; `null` clears an optional field. The verification state is not writable.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePhysicalItemRequest' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/PhysicalItem' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [collection]
      operationId: deletePhysicalItem
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/Error' }

  /v1/playlists:
    get:
      tags: [playlists]
      operationId: listPlaylists
      parameters: [ { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: Caller's playlists, content: { application/json: { schema: { $ref: '#/components/schemas/PlaylistSummaryPage' } } } }
    post:
      tags: [playlists]
      operationId: createPlaylist
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreatePlaylistRequest' } } }
      responses:
        '201':
          description: Created
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Playlist' } } }
  /v1/playlists/{playlist_id}:
    parameters: [ { $ref: '#/components/parameters/PlaylistId' } ]
    get:
      tags: [playlists]
      operationId: getPlaylist
      responses:
        '200':
          description: >-
            Playlist with its first page of items (up to 100) and per-item availability.
            Read further pages with `GET /v1/playlists/{playlist_id}/items?cursor=…`.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Playlist' } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [playlists]
      operationId: updatePlaylist
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePlaylistRequest' } } }
      responses:
        '200':
          description: Updated
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Playlist' } } }
        '404': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
    delete:
      tags: [playlists]
      operationId: deletePlaylist
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /v1/playlists/{playlist_id}/items:
    parameters: [ { $ref: '#/components/parameters/PlaylistId' } ]
    get:
      tags: [playlists]
      operationId: listPlaylistItems
      description: >-
        Pages of items ordered by position, with availability re-evaluated on every read.
        Cursors are bound to the playlist version: after any edit an older cursor returns
        409 `INVALID_STATE` and the client reads again from the first page.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Items page
          content: { application/json: { schema: { $ref: '#/components/schemas/PlaylistItemPage' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    post:
      tags: [playlists]
      operationId: addPlaylistItem
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddPlaylistItemRequest' } } }
      responses:
        '201':
          description: Added; returns the full playlist
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Playlist' } } }
        '404': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /v1/playlists/{playlist_id}/items/{item_id}:
    parameters: [ { $ref: '#/components/parameters/PlaylistId' }, { name: item_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    delete:
      tags: [playlists]
      operationId: removePlaylistItem
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200':
          description: Removed; returns the full playlist
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Playlist' } } }
        '404': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /v1/playlists/{playlist_id}/items/{item_id}/move:
    parameters: [ { $ref: '#/components/parameters/PlaylistId' }, { name: item_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    post:
      tags: [playlists]
      operationId: movePlaylistItem
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MovePlaylistItemRequest' } } }
      responses:
        '200':
          description: Moved; returns the full playlist
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Playlist' } } }
        '404': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }

  /v1/exports:
    post:
      tags: [exports]
      operationId: createExport
      parameters: [ { $ref: '#/components/parameters/IdempotencyKeyRequired' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateExportRequest' } } }
      responses:
        '202': { description: Export queued, content: { application/json: { schema: { $ref: '#/components/schemas/Export' } } } }
        '429': { $ref: '#/components/responses/Error' }
  /v1/exports/{export_id}:
    parameters: [ { name: export_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    get:
      tags: [exports]
      operationId: getExport
      responses:
        '200': { description: Export status; download_url present only when ready, content: { application/json: { schema: { $ref: '#/components/schemas/Export' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /v1/entitlements:
    get:
      tags: [entitlements]
      operationId: listEntitlements
      responses:
        '200': { description: Caller's entitlements, content: { application/json: { schema: { $ref: '#/components/schemas/EntitlementList' } } } }
  /v1/subscription:
    get:
      tags: [entitlements]
      operationId: getSubscription
      responses:
        '200': { description: Current subscription or null, content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionEnvelope' } } } }

  /v1/subscription/plan:
    get:
      tags: [commerce]
      operationId: getSubscriptionPlan
      description: >
        The monthly plan at its price with VAT included. The price is a configuration
        placeholder (SUBSCRIPTION_PRICE_MINOR) until pricing is decided (Q03, Q04);
        only KR accounts can subscribe for now.
      responses:
        '200': { description: Plan, content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionPlan' } } } }
  /v1/subscription/checkout:
    post:
      tags: [commerce]
      operationId: checkoutSubscription
      description: >
        Opens a checkout for one month. The period starts at the later of now and the current
        paid-through date and renews monthly until stopped (COM-008). A pending checkout is
        returned (200); an active subscription is not sold again (409; resume renewal instead).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKeyRequired' } ]
      requestBody:
        content: { application/json: { schema: { type: object, additionalProperties: false } } }
      responses:
        '201':
          description: Checkout opened
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '200':
          description: The pending checkout
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '403': { description: Not available in the caller's region, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '503': { description: Checkout is off, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/subscription/cancel:
    post:
      tags: [commerce]
      operationId: stopSubscriptionRenewal
      description: Stops automatic renewal. Access continues until the paid-through date; this is not a refund. Purchases are unaffected (COM-009).
      responses:
        '200': { description: Subscription after the change, content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionEnvelope' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/subscription/resume:
    post:
      tags: [commerce]
      operationId: resumeSubscriptionRenewal
      description: Turns automatic renewal back on while a paid sandbox subscription is still active (no payment now).
      responses:
        '200': { description: Subscription after the change, content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionEnvelope' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /v1/releases/{release_id}/offer:
    parameters: [ { name: release_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    get:
      tags: [commerce]
      operationId: getReleaseOffer
      description: >
        The release's offer in the caller's licence territory, at the server's price with VAT
        included (COM-013), with the purchase terms shown before payment (COM-012). 404 when
        there is no offer for the territory or a track lacks rights there.
      responses:
        '200': { description: Offer, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseOffer' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/orders:
    get:
      tags: [commerce]
      operationId: listOrders
      responses:
        '200': { description: "Caller's orders, newest first", content: { application/json: { schema: { $ref: '#/components/schemas/OrderList' } } } }
    post:
      tags: [commerce]
      operationId: createOrder
      description: >
        Opens an order with a frozen snapshot and a provider checkout. While an order for the
        same offer is pending, it is returned (200) instead of opening another (COM-010).
        Payment is confirmed only by a verified provider event, never by the client (COM-004).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKeyRequired' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrderRequest' } } }
      responses:
        '201':
          description: Order opened; pay at checkout_url
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '200':
          description: The pending order for this offer
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '403': { description: RIGHTS_UNAVAILABLE in the caller's territory, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: Already owned (set confirm_already_owned) or no longer on sale, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Checkout is off (no payment provider configured), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/orders/{order_id}:
    parameters: [ { name: order_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    get:
      tags: [commerce]
      operationId: getOrder
      responses:
        '200':
          description: Order (another user's order is 404)
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/orders/{order_id}/cancel:
    parameters: [ { name: order_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    post:
      tags: [commerce]
      operationId: cancelOrder
      description: Abandons a pending order. A payment that still arrives is refunded.
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/dig/entities/{entity_id}/axes:
    parameters: [ { $ref: '#/components/parameters/EntityId' } ]
    get:
      tags: [dig]
      operationId: getDigAxes
      responses:
        '200': { description: Available exploration axes with counts, content: { application/json: { schema: { $ref: '#/components/schemas/DigAxes' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/dig/crate:
    get:
      tags: [dig]
      operationId: digCrate
      description: >-
        Crate Digging, private (DIG-009): a random crate of albums released in the given years, each with
        at least one track the caller can play, filtered by the popularity of its most popular track.
        Nothing is stored. Entities excluded by a reviewed integrity decision are omitted. Rate limited
        (240 per hour).
      parameters:
        - { name: from, in: query, schema: { type: integer, minimum: 1900, maximum: 2100 } }
        - { name: to, in: query, schema: { type: integer, minimum: 1900, maximum: 2100 } }
        - { name: popularity, in: query, schema: { $ref: '#/components/schemas/PopularityFilter' } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 24, default: 12 } }
      responses:
        '200': { description: The crate, content: { application/json: { schema: { $ref: '#/components/schemas/Crate' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /v1/dig/labels/{label_id}/timeline:
    parameters: [ { name: label_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    get:
      tags: [dig]
      operationId: getLabelTimeline
      description: >-
        Label Digging, basic (DIG-011): the label's releases grouped by release year (undated last)
        and each artist's span on the label. Up to 1000 releases (`truncated` when more). Entities
        excluded by a reviewed integrity decision are omitted.
      responses:
        '200': { description: Timeline, content: { application/json: { schema: { $ref: '#/components/schemas/LabelTimeline' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/blind-digs:
    post:
      tags: [dig]
      operationId: startBlindDig
      description: >-
        Blind Digging (DIG-010): deals up to 10 recordings the caller can play — from the start entity's
        connections, or from the whole catalog — in random order, without artist, release, year or
        popularity. Each item reveals its recording after a decision. Rate limited (60 per hour).
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/StartBlindDigRequest' } } }
      responses:
        '201': { description: The round (may be empty when nothing is playable), content: { application/json: { schema: { $ref: '#/components/schemas/BlindDig' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/blind-digs/{blind_dig_id}:
    parameters: [ { name: blind_dig_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    get:
      tags: [dig]
      operationId: getBlindDig
      responses:
        '200': { description: The round, content: { application/json: { schema: { $ref: '#/components/schemas/BlindDig' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/blind-digs/{blind_dig_id}/items/{item_id}/decision:
    parameters:
      - { name: blind_dig_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      - { name: item_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    post:
      tags: [dig]
      operationId: decideBlindDigItem
      description: Keep (saves the recording to the library) or Pass. Final; repeating the same decision is accepted, changing it is 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [keep, pass] }
      responses:
        '200': { description: The round with the item revealed, content: { application/json: { schema: { $ref: '#/components/schemas/BlindDig' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/dig/entities/{entity_id}/connections:
    parameters: [ { $ref: '#/components/parameters/EntityId' } ]
    get:
      tags: [dig]
      operationId: getDigConnections
      parameters:
        - { name: axis, in: query, required: true, schema: { $ref: '#/components/schemas/DigAxis' } }
        - { name: popularity, in: query, schema: { $ref: '#/components/schemas/PopularityFilter' } }
        - { name: include_inferred, in: query, schema: { type: boolean, default: true } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Connections with evidence, content: { application/json: { schema: { $ref: '#/components/schemas/DigConnectionPage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/dig-sessions:
    get:
      tags: [dig]
      operationId: listDigSessions
      parameters:
        - { name: saved, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Caller's sessions, content: { application/json: { schema: { $ref: '#/components/schemas/DigSessionSummaryPage' } } } }
    post:
      tags: [dig]
      operationId: startDigSession
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StartDigSessionRequest' } } }
      responses:
        '201': { description: Session started (may be in empty state), content: { application/json: { schema: { $ref: '#/components/schemas/DigSession' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/dig-sessions/{dig_session_id}:
    parameters: [ { $ref: '#/components/parameters/DigSessionId' } ]
    get:
      tags: [dig]
      operationId: getDigSession
      responses:
        '200': { description: Session with trail, content: { application/json: { schema: { $ref: '#/components/schemas/DigSession' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [dig]
      operationId: updateDigSession
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateDigSessionRequest' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/DigSession' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/dig-sessions/{dig_session_id}/steps:
    parameters: [ { $ref: '#/components/parameters/DigSessionId' } ]
    post:
      tags: [dig]
      operationId: addDigStep
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddDigStepRequest' } } }
      responses:
        '201': { description: Step recorded, content: { application/json: { schema: { $ref: '#/components/schemas/DigSession' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/dig-sessions/{dig_session_id}/cursor:
    parameters: [ { $ref: '#/components/parameters/DigSessionId' } ]
    post:
      tags: [dig]
      operationId: moveDigCursor
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [seq], properties: { seq: { type: integer, minimum: 0 } } } } }
      responses:
        '200': { description: Cursor moved to an earlier node, content: { application/json: { schema: { $ref: '#/components/schemas/DigSession' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/dig-sessions/{dig_session_id}/nodes/{seq}/actions:
    parameters:
      - { $ref: '#/components/parameters/DigSessionId' }
      - { name: seq, in: path, required: true, schema: { type: integer, minimum: 0 } }
    post:
      tags: [dig]
      operationId: recordDigNodeAction
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [action], properties: { action: { type: string, enum: [played, saved] } } } } }
      responses:
        '200': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/DigSession' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/dig-sessions/{dig_session_id}/end:
    parameters: [ { $ref: '#/components/parameters/DigSessionId' } ]
    post:
      tags: [dig]
      operationId: endDigSession
      responses:
        '200': { description: Ended, content: { application/json: { schema: { $ref: '#/components/schemas/DigSession' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /v1/dig-sessions/{dig_session_id}/playlist:
    parameters: [ { $ref: '#/components/parameters/DigSessionId' } ]
    post:
      tags: [dig]
      operationId: createPlaylistFromTrail
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, additionalProperties: false, properties: { title: { type: string, minLength: 1, maxLength: 200 } } } } }
      responses:
        '201':
          description: Playlist with the trail's recordings in order
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Playlist' } } }
        '404': { $ref: '#/components/responses/Error' }

  /v1/search:
    get:
      tags: [search]
      operationId: search
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: scope, in: query, schema: { type: string, enum: [all, catalog, mine], default: all } }
        - { name: types, in: query, description: Comma-separated kinds, schema: { type: string } }
        - { name: mode, in: query, schema: { type: string, enum: [text], default: text }, description: '`semantic` reserved (P2)' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Results, content: { application/json: { schema: { $ref: '#/components/schemas/SearchPage' } } } }
        '400': { $ref: '#/components/responses/Error' }

  /v1/reports:
    post:
      tags: [integrity]
      operationId: createReport
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateReportRequest' } } }
      responses:
        '201': { description: Report received, content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /v1/ops/users/{user_id}/support-summary:
    parameters: [ { name: user_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    get:
      tags: [ops]
      operationId: opsUserSupportSummary
      description: >-
        A user's account state for support without database access (R18): one section per module
        (account, subscription, audio, playback, library, reports) with counts, states, timestamps and
        ids only. Never contains private content: titles, notes, filenames, audio, storage keys, URLs,
        devices or identity-provider subjects (OPS-007, T30). Each view is audited with the reason.
      parameters:
        - { name: reason, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 500 } }
      responses:
        '200':
          description: Support summary
          content:
            application/json:
              schema:
                type: object
                required: [user_id, generated_at, sections]
                properties:
                  user_id: { $ref: '#/components/schemas/Id' }
                  generated_at: { $ref: '#/components/schemas/Timestamp' }
                  sections:
                    type: object
                    additionalProperties: { type: object }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/ops/recordings/{recording_id}/rights-grants:
    parameters: [ { name: recording_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    get:
      tags: [ops]
      operationId: opsListRightsGrants
      description: All rights grants of a recording, oldest first, with versions for If-Match (ops console).
      responses:
        '200':
          description: Grants
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RightsGrant' } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/ops/recordings/{recording_id}/audio-removal:
    parameters: [ { name: recording_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    post:
      tags: [ops]
      operationId: opsRemoveCatalogAudio
      description: >-
        Final takedown/contract-end step (R10): removes the recording's licensed audio. Refused
        (409 INVALID_STATE) while any rights grant for the recording is in force or suspended, or
        when there is no audio. Playback ends immediately; originals and derivatives are deleted
        asynchronously. Metadata, credits and library/playlist references remain (`no_audio`).
        Audited with the mandatory reason.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKeyRequired' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { $ref: '#/components/schemas/Reason' } } } } }
      responses:
        '202':
          description: Access ended; audio files are being deleted
          content:
            application/json:
              schema:
                type: object
                required: [recording_id, audio_source_id, status]
                properties:
                  recording_id: { $ref: '#/components/schemas/Id' }
                  audio_source_id: { $ref: '#/components/schemas/Id' }
                  status: { type: string, enum: [deleting] }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/ops/rights-grants:
    post:
      tags: [ops]
      operationId: opsCreateRightsGrant
      parameters: [ { $ref: '#/components/parameters/IdempotencyKeyRequired' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateRightsGrantRequest' } } }
      responses:
        '201':
          description: Created
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/RightsGrant' } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/ops/rights-grants/{rights_grant_id}/status:
    parameters: [ { name: rights_grant_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    post:
      tags: [ops]
      operationId: opsChangeRightsGrantStatus
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChangeStatusRequest' } } }
      responses:
        '200':
          description: Changed; affected sessions revoked asynchronously (≤ 60 s)
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/RightsGrant' } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /v1/ops/offers:
    post:
      tags: [ops, commerce]
      operationId: opsCreateOffer
      description: Puts a release on sale (KRW, VAT included; one offer on sale per release).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateOfferRequest' } } }
      responses:
        '201': { description: On sale, content: { application/json: { schema: { $ref: '#/components/schemas/Offer' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/ops/releases/{release_id}/offers:
    parameters: [ { name: release_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    get:
      tags: [ops, commerce]
      operationId: opsListReleaseOffers
      responses:
        '200': { description: 'All offers of the release, newest first', content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Offer' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /v1/ops/offers/{offer_id}/withdraw:
    parameters: [ { name: offer_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    post:
      tags: [ops, commerce]
      operationId: opsWithdrawOffer
      description: Ends the sale; pending orders are cancelled and late payments refunded (COM-018).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } }
      responses:
        '200': { description: Withdrawn, content: { application/json: { schema: { $ref: '#/components/schemas/Offer' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/ops/orders/{order_id}:
    parameters: [ { name: order_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    get:
      tags: [ops, commerce]
      operationId: opsGetOrder
      responses:
        '200':
          description: Order with provider events, refunds and ledger lines
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/OpsOrder' } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/ops/orders/{order_id}/refunds:
    parameters: [ { name: order_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    post:
      tags: [ops, commerce]
      operationId: opsRefundOrder
      description: Full refund of a paid order. The entitlement is revoked when the provider confirms.
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } }
      responses:
        '202':
          description: Refund requested
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /v1/ops/entitlements:
    post:
      tags: [ops]
      operationId: opsGrantEntitlement
      parameters: [ { $ref: '#/components/parameters/IdempotencyKeyRequired' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GrantEntitlementRequest' } } }
      responses:
        '201':
          description: Granted
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Entitlement' } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/ops/entitlements/{entitlement_id}/status:
    parameters: [ { name: entitlement_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    post:
      tags: [ops]
      operationId: opsChangeEntitlementStatus
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChangeStatusRequest' } } }
      responses:
        '200':
          description: Changed
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Entitlement' } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /v1/ops/users/{user_id}/subscription:
    parameters: [ { name: user_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    put:
      tags: [ops]
      operationId: opsSetSubscription
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SetSubscriptionRequest' } } }
      responses:
        '200': { description: Subscription state set (operator/sandbox only), content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionEnvelope' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/ops/users/{user_id}/license-country:
    parameters: [ { name: user_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    put:
      tags: [ops]
      operationId: opsSetLicenseCountry
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [license_country, reason], properties: { license_country: { $ref: '#/components/schemas/Country' }, reason: { $ref: '#/components/schemas/Reason' } } } } }
      responses:
        '200': { description: Set, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/ops/jobs:
    get:
      tags: [ops]
      operationId: opsListJobs
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [queued, running, succeeded, failed, dead] } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Jobs (payload omitted), content: { application/json: { schema: { $ref: '#/components/schemas/JobList' } } } }
        '403': { $ref: '#/components/responses/Error' }
  /v1/ops/jobs/{job_id}/retry:
    parameters: [ { name: job_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    post:
      tags: [ops]
      operationId: opsRetryJob
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { $ref: '#/components/schemas/Reason' } } } } }
      responses:
        '200': { description: Requeued, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/ops/reports:
    get:
      tags: [ops]
      operationId: opsListReports
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [received, triaged, actioned, dismissed] } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Reports for triage (reporter identity omitted)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [report_id, subject_type, subject_id, reason_code, details, status, created_at]
                      properties:
                        report_id: { $ref: '#/components/schemas/Id' }
                        subject_type: { type: string }
                        subject_id: { $ref: '#/components/schemas/Id' }
                        reason_code: { type: string }
                        details: { type: [string, 'null'] }
                        status: { type: string }
                        created_at: { $ref: '#/components/schemas/Timestamp' }
        '403': { $ref: '#/components/responses/Error' }
  /v1/ops/reports/{report_id}/status:
    parameters: [ { name: report_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    post:
      tags: [ops]
      operationId: opsChangeReportStatus
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [status, reason], properties: { status: { type: string, enum: [triaged, actioned, dismissed] }, reason: { $ref: '#/components/schemas/Reason' } } } } }
      responses:
        '200': { description: Changed, content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/ops/integrity-signals:
    post:
      tags: [ops]
      operationId: opsRecordIntegritySignal
      description: Records a reviewed decision on one integrity axis. Only reviewed `recommendation_eligibility = excluded` removes an entity from DIG candidates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject_entity_id, axis, value, reason]
              properties:
                subject_entity_id: { $ref: '#/components/schemas/Id' }
                axis: { type: string, enum: [ai_generation, technical_quality, spam_risk, rights_status, recommendation_eligibility] }
                value: { type: string, minLength: 1, maxLength: 50 }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '201':
          description: Recorded
          content: { application/json: { schema: { type: object, required: [axis, value, basis], properties: { axis: { type: string }, value: { type: string }, basis: { type: string, enum: [reviewed] } } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /media/v1/{token}/{file}:
    get:
      tags: [media]
      operationId: getMedia
      security: []
      description: Data-plane gateway. Token is HMAC-signed, ≤ 60 s, bound to a playback session; the session must still be active.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string, pattern: '^(index\\.m3u8|init\\.mp4|seg_\\d{5}\\.m4s)$' } }
      responses:
        '200': { description: Manifest or segment bytes }
        '403': { description: Token invalid/expired or session revoked }
        '404': { description: Unknown path }

  /webhooks/payments/{provider}:
    parameters: [ { name: provider, in: path, required: true, schema: { type: string, maxLength: 20 } } ]
    post:
      tags: [commerce]
      operationId: receivePaymentWebhook
      security: []
      description: >
        Payment provider events (COM-005). Authenticated by the provider's signature over the raw
        body and a timestamp within 5 minutes; stored before the response and applied once by a
        job, so a redelivery is acknowledged as a duplicate. The mock provider signs with the
        `mock-pay-signature` header (`t=<unix>,v1=<hex HMAC-SHA256 of "t.body">`).
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { description: Stored (or a duplicate), content: { application/json: { schema: { type: object, required: [received, duplicate], properties: { received: { type: boolean }, duplicate: { type: boolean } } } } } }
        '400': { description: 'Signature, timestamp or payload rejected', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not the configured provider, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /dev/mock-pay/checkouts/{checkout_ref}:
    parameters: [ { name: checkout_ref, in: path, required: true, schema: { type: string, pattern: '^mck_[0-9a-f]{24}$' } } ]
    get:
      tags: [system]
      operationId: devMockCheckout
      security: []
      x-rabit-status: dev-only
      description: The sandbox provider's checkout (PAYMENTS_PROVIDER=mock, never in production).
      responses:
        '200': { description: Checkout, content: { application/json: { schema: { $ref: '#/components/schemas/MockCheckout' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /dev/mock-pay/checkouts/{checkout_ref}/complete:
    parameters: [ { name: checkout_ref, in: path, required: true, schema: { type: string, pattern: '^mck_[0-9a-f]{24}$' } } ]
    post:
      tags: [system]
      operationId: devMockCompleteCheckout
      security: []
      x-rabit-status: dev-only
      description: Simulates the buyer paying (or failing) at the sandbox provider; the outcome arrives as a signed webhook.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [outcome], properties: { outcome: { type: string, enum: [succeeded, failed] } } } } }
      responses:
        '202': { description: Outcome recorded; webhook queued, content: { application/json: { schema: { type: object } } } }
        '409': { $ref: '#/components/responses/Error' }

  /dev/mock-pay/cards/{user_id}:
    parameters: [ { name: user_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } } ]
    put:
      tags: [system]
      operationId: devMockCard
      security: []
      x-rabit-status: dev-only
      description: Makes the sandbox provider decline (or accept) the user's renewal charges.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [declined], properties: { declined: { type: boolean } } } } }
      responses:
        '200': { description: Stored, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Error' }

  /dev/.well-known/jwks.json:
    get:
      tags: [system]
      operationId: devJwks
      security: []
      x-rabit-status: dev-only
      description: Public keys of the development issuer (ADR-0009); disabled with it.
      responses:
        '200': { description: JWKS, content: { application/json: { schema: { type: object, required: [keys], properties: { keys: { type: array, items: { type: object } } } } } } }
  /dev/token:
    post:
      tags: [system]
      operationId: devIssueToken
      security: []
      x-rabit-status: dev-only
      description: Development issuer (ADR-0009). Disabled unless NODE_ENV != production and AUTH_DEV_ISSUER_ENABLED=true.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [subject], properties: { subject: { type: string, minLength: 1, maxLength: 64 }, operator: { type: boolean, default: false } } } } }
      responses:
        '200': { description: Token, content: { application/json: { schema: { type: object, required: [access_token, expires_in], properties: { access_token: { type: string }, expires_in: { type: integer } } } } } }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  headers:
    ETag: { description: Aggregate version, schema: { type: string } }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { $ref: '#/components/schemas/IdempotencyKey' } }
    IdempotencyKeyRequired: { name: Idempotency-Key, in: header, required: true, schema: { $ref: '#/components/schemas/IdempotencyKey' } }
    IfMatch: { name: If-Match, in: header, required: false, description: Required for mutation (428 if missing), schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Cursor: { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
    UploadId: { name: upload_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    AudioSourceId: { name: audio_source_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    PlaylistId: { name: playlist_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    EntityId: { name: entity_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    DigSessionId: { name: dig_session_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
  responses:
    Error:
      description: Error envelope
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Id: { type: string, pattern: '^[a-z]{3}_[0-9A-HJKMNP-TV-Z]{26}$' }
    IdempotencyKey: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
    Timestamp: { type: string, format: date-time }
    Country: { type: string, pattern: '^[A-Z]{2}$' }
    Reason: { type: string, minLength: 3, maxLength: 500 }
    Sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    NextCursor: { type: [string, 'null'] }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        checks: { type: object, additionalProperties: { type: string } }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            retryable: { type: boolean }
            details: { type: object }

    Me:
      type: object
      required: [user_id, status, personal_workspace_id, license_country, quota, subscription_state, is_operator]
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        status: { type: string, enum: [active, deletion_requested, deleted] }
        personal_workspace_id: { $ref: '#/components/schemas/Id' }
        license_country: { type: [string, 'null'] }
        subscription_state: { type: string, enum: [none, active, past_due, cancelled, expired] }
        is_operator: { type: boolean }
        quota:
          type: object
          required: [policy_id, max_total_bytes, used_bytes, reserved_bytes, max_file_bytes, max_duration_ms]
          properties:
            policy_id: { type: string }
            max_total_bytes: { type: integer }
            used_bytes: { type: integer }
            reserved_bytes: { type: integer }
            max_file_bytes: { type: integer }
            max_duration_ms: { type: integer }
    AccountDeletion:
      type: object
      required: [user_id, state]
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        state: { type: string, enum: [requested, in_progress, completed] }

    CreateUploadRequest:
      type: object
      additionalProperties: false
      required: [intent, size_bytes, sha256]
      properties:
        intent: { type: string, enum: [private_upload, audio_log] }
        size_bytes: { type: integer, minimum: 1 }
        sha256: { $ref: '#/components/schemas/Sha256' }
        filename: { type: string, maxLength: 255, description: Untrusted; used only as default title }
        content_type: { type: string, maxLength: 100, description: Untrusted hint }
    UploadIntent:
      type: object
      required: [upload, upload_url, upload_method, upload_headers, expires_at]
      properties:
        upload: { $ref: '#/components/schemas/Upload' }
        upload_url: { type: string }
        upload_method: { type: string, enum: [PUT] }
        upload_headers: { type: object, additionalProperties: { type: string } }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    Upload:
      type: object
      required: [upload_id, intent, state, size_bytes, created_at, expires_at, audio_source_id, failure_code]
      properties:
        upload_id: { $ref: '#/components/schemas/Id' }
        intent: { type: string, enum: [private_upload, audio_log] }
        state: { type: string, enum: [created, uploading, quarantined, processing, ready, failed, cancelled, expired] }
        size_bytes: { type: integer }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        audio_source_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        failure_code: { type: [string, 'null'] }

    Capabilities:
      type: object
      required: [play, download_export, publish, analyze]
      properties:
        play: { type: boolean }
        download_export: { type: boolean }
        publish: { type: boolean }
        analyze: { type: boolean }
    AudioSource:
      type: object
      required: [audio_source_id, audio_object_id, version_id, kind, origin, visibility, status, title, duration_ms, created_at, capabilities, technical]
      properties:
        audio_source_id: { $ref: '#/components/schemas/Id' }
        audio_object_id: { $ref: '#/components/schemas/Id' }
        version_id: { $ref: '#/components/schemas/Id' }
        kind: { type: string, enum: [private_audio, audio_log, recording] }
        origin: { type: string, enum: [private_upload, audio_log, catalog] }
        visibility: { type: string, enum: [private, public] }
        status: { type: string, enum: [processing, ready, failed, deleting, deleted] }
        title: { type: [string, 'null'] }
        duration_ms: { type: [integer, 'null'] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        failure_code: { type: [string, 'null'] }
        capabilities: { $ref: '#/components/schemas/Capabilities' }
        technical:
          type: object
          properties:
            sample_rate: { type: integer }
            channels: { type: integer }
            codec: { type: string }
            integrated_lufs: { type: number }
            true_peak_dbtp: { type: number }
    AudioSourcePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AudioSource' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    UpdateAudioSourceRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
    Waveform:
      type: object
      required: [audio_source_id, samples_per_peak, sample_rate, peaks]
      properties:
        audio_source_id: { $ref: '#/components/schemas/Id' }
        samples_per_peak: { type: integer }
        sample_rate: { type: integer }
        peaks: { type: array, items: { type: number, minimum: 0, maximum: 1 } }

    CreateAudioLogRequest:
      type: object
      additionalProperties: false
      required: [audio_source_id, title, recorded_at, recorded_tz]
      properties:
        audio_source_id: { $ref: '#/components/schemas/Id' }
        title: { type: string, minLength: 1, maxLength: 200 }
        note: { type: string, maxLength: 5000 }
        recorded_at: { $ref: '#/components/schemas/Timestamp' }
        recorded_tz: { type: string, maxLength: 64, description: IANA time zone }
        linked_recording_id: { $ref: '#/components/schemas/Id' }
        tags: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 40 } }
    UpdateAudioLogRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 5000 }
        recorded_at: { $ref: '#/components/schemas/Timestamp' }
        recorded_tz: { type: string, maxLength: 64 }
        linked_recording_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        tags: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 40 } }
    AudioLog:
      type: object
      required: [audio_log_id, audio_source_id, title, note, recorded_at, recorded_tz, linked_recording_id, tags, source_status, created_at]
      properties:
        audio_log_id: { $ref: '#/components/schemas/Id' }
        audio_source_id: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        note: { type: [string, 'null'] }
        recorded_at: { $ref: '#/components/schemas/Timestamp' }
        recorded_tz: { type: string }
        linked_recording_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        tags: { type: array, items: { type: string } }
        source_status: { type: string, enum: [processing, ready, failed, deleting, deleted] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    AudioLogPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AudioLog' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    CreatePlaybackSessionRequest:
      type: object
      additionalProperties: false
      required: [device_id]
      description: Exactly one of audio_source_id or recording_id.
      properties:
        audio_source_id: { $ref: '#/components/schemas/Id' }
        recording_id: { $ref: '#/components/schemas/Id' }
        device_id: { type: string, pattern: '^[A-Za-z0-9_-]{8,64}$' }
        desired_quality: { type: string, enum: [auto], default: auto }
        mode: { type: string, enum: [original], default: original }
    PlaybackSession:
      type: object
      required: [session_id, audio_source_id, manifest_url, expires_at, media_token_expires_at, quality, capabilities, source]
      properties:
        session_id: { $ref: '#/components/schemas/Id' }
        audio_source_id: { $ref: '#/components/schemas/Id' }
        manifest_url: { type: string }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        media_token_expires_at: { $ref: '#/components/schemas/Timestamp' }
        source: { type: string, enum: [catalog, private_upload, audio_log] }
        quality:
          type: object
          required: [codec, bitrate_kbps, lossless, provisional]
          properties:
            codec: { type: string }
            bitrate_kbps: { type: integer }
            lossless: { type: boolean }
            provisional: { type: boolean, description: True while the codec ladder is provisional (ADR-0008) }
        capabilities:
          type: object
          required: [seek, offline, stems, transform]
          properties:
            seek: { type: boolean }
            offline: { type: boolean }
            stems: { type: boolean }
            transform: { type: boolean }
    ListeningEvent:
      type: object
      additionalProperties: false
      required: [event_id, session_id, sequence, type, position_ms, played_ms, client_time]
      properties:
        event_id: { type: string, format: uuid }
        session_id: { $ref: '#/components/schemas/Id' }
        sequence: { type: integer, minimum: 0 }
        type: { type: string, enum: [started, heartbeat, seek, paused, ended] }
        position_ms: { type: integer, minimum: 0 }
        played_ms: { type: integer, minimum: 0 }
        client_time: { $ref: '#/components/schemas/Timestamp' }
    ListeningEventBatch:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/ListeningEvent' } }
    ListeningEventBatchResult:
      type: object
      required: [accepted, duplicates, rejected]
      properties:
        accepted: { type: integer }
        duplicates: { type: integer }
        rejected:
          type: array
          items: { type: object, required: [event_id, reason], properties: { event_id: { type: string }, reason: { type: string } } }

    Playability:
      type: object
      required: [playable, reason]
      properties:
        playable: { type: boolean }
        reason: { type: [string, 'null'], enum: [null, not_ready, rights_unavailable, subscription_required, purchase_available, no_audio, deleted, not_found] }
    ArtistRef:
      type: object
      required: [entity_id, name]
      properties:
        entity_id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
    Recording:
      type: object
      required: [recording_id, title, artists, duration_ms, isrc, releases, playability]
      properties:
        recording_id: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        artists: { type: array, items: { $ref: '#/components/schemas/ArtistRef' } }
        duration_ms: { type: [integer, 'null'] }
        isrc: { type: [string, 'null'] }
        releases:
          type: array
          description: Primary release first (earliest date; undated last; ties by id), the same choice as primary_release_id elsewhere.
          items: { type: object, required: [release_id, title], properties: { release_id: { $ref: '#/components/schemas/Id' }, title: { type: string } } }
        playability: { $ref: '#/components/schemas/Playability' }
    Release:
      type: object
      required: [release_id, title, release_type, artists, label, release_date, tracks]
      properties:
        release_id: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        release_type: { type: string, enum: [album, single, ep, compilation] }
        artists: { type: array, items: { $ref: '#/components/schemas/ArtistRef' } }
        label: { oneOf: [ { $ref: '#/components/schemas/ArtistRef' }, { type: 'null' } ] }
        release_date: { type: [string, 'null'], format: date }
        tracks:
          type: array
          items:
            type: object
            required: [disc_no, position, recording_id, title, duration_ms, playability]
            properties:
              disc_no: { type: integer }
              position: { type: integer }
              recording_id: { $ref: '#/components/schemas/Id' }
              title: { type: string }
              duration_ms: { type: [integer, 'null'] }
              playability: { $ref: '#/components/schemas/Playability' }
    EntitySummary:
      type: object
      required: [entity_id, entity_type, name]
      properties:
        entity_id: { $ref: '#/components/schemas/Id' }
        entity_type: { type: string, enum: [artist, person, label, release, recording] }
        name: { type: string }
        subtitle: { type: [string, 'null'] }
        primary_release_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ], description: "Recordings only: the earliest-dated release carrying the track (ties and undated last, by id); the album whose artwork represents it" }

    Passport:
      type: object
      required: [recording_id, creation, credits, claims, integrity, report_url]
      properties:
        recording_id: { $ref: '#/components/schemas/Id' }
        creation:
          type: array
          description: Creation method per stage; stages without a claim are `unknown`.
          items:
            type: object
            required: [stage, method, verification_state, basis]
            properties:
              stage: { type: string, enum: [composition, lyrics, vocals, instruments, mixing, mastering, artwork] }
              method: { type: string, enum: [human, ai_assisted, ai_generated, unknown] }
              verification_state: { type: [string, 'null'], enum: [null, self_declared, distributor_verified, signature_valid, process_evidence_reviewed, rights_reviewed] }
              basis: { type: [string, 'null'], enum: [null, verified_fact, declared, ml_inferred] }
        credits: { type: array, items: { $ref: '#/components/schemas/Credit' } }
        claims:
          type: array
          items:
            type: object
            required: [claim_type, value, issuer, verification_state, basis]
            properties:
              claim_type: { type: string }
              value: { type: string }
              issuer: { type: string }
              verification_state: { type: string }
              basis: { type: string }
        integrity:
          type: array
          description: Independent axes; never a single quality score; internal scores are never exposed.
          items:
            type: object
            required: [axis, value, basis]
            properties:
              axis: { type: string, enum: [ai_generation, technical_quality, spam_risk, rights_status, recommendation_eligibility] }
              value: { type: string }
              basis: { type: string, enum: [declared, automated, reviewed] }
        report_url: { type: string }
    Credit:
      type: object
      required: [credit_id, contributor, role, instrument, creation_method, basis, verification_state, source]
      properties:
        credit_id: { $ref: '#/components/schemas/Id' }
        contributor: { $ref: '#/components/schemas/ArtistRef' }
        role: { type: string }
        instrument: { type: [string, 'null'] }
        creation_method: { type: string, enum: [human, ai_assisted, ai_generated, unknown] }
        basis: { type: string, enum: [verified_fact, declared, ml_inferred] }
        verification_state: { type: string }
        source: { type: string }

    LibraryRefType: { type: string, enum: [audio_source, recording, release] }
    AddLibraryItemRequest:
      type: object
