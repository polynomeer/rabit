        valid_to: { oneOf: [ { $ref: '#/components/schemas/Timestamp' }, { type: 'null' } ] }
        version: { type: integer }
    EntitlementList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Entitlement' } }
    Subscription:
      type: object
      required: [subscription_id, plan, state, paid_through, source]
      properties:
        subscription_id: { $ref: '#/components/schemas/Id' }
        plan: { type: string }
        state: { type: string, enum: [active, past_due, cancelled, expired] }
        paid_through: { $ref: '#/components/schemas/Timestamp' }
        source: { type: string, enum: [operator, sandbox] }
    SubscriptionEnvelope:
      type: object
      required: [subscription]
      properties:
        subscription: { oneOf: [ { $ref: '#/components/schemas/Subscription' }, { type: 'null' } ] }

    DigAxis:
      type: string
      enum: [credits, same_producer, session_musicians, same_label, samples, sampled_by, covers, covered_by, remixes, remix_of, influences, influenced_by, members, member_of, releases, tracks, artists]
    PopularityFilter:
      type: string
      enum: [any, below_top_50, deep_cuts, obscure]
      default: any
    Evidence:
      type: object
      required: [basis, verification_state, source, confidence, license_status, explanation, reason]
      properties:
        basis: { type: string, enum: [verified_fact, declared, ml_inferred] }
        verification_state: { type: string }
        source: { type: string }
        confidence: { type: [number, 'null'] }
        license_status: { type: [string, 'null'], enum: [null, unknown, licensed, not_applicable] }
        explanation: { type: string, description: 'English sentence, for example "Same producer: X". Kept for existing clients; localized clients render `reason`.' }
        reason:
          description: >-
            The same reason as a code plus values, so clients render it in their own
            language. Null on trail nodes stored before codes existed (fall back to
            `explanation`). Codes: relation.<axis> (subject, object), credit (role,
            name, instrument?), credited_as (role, name), same_producer (name),
            same_session_player (name, instrument?), main_artist, on_release,
            recording_by_artist, appears_on, released_on_label, release_by_artist,
            same_label (name). `role` is a credit role code. Clients show
            `explanation` for codes they do not know.
          oneOf:
            - type: 'null'
            - type: object
              required: [code, params]
              properties:
                code: { type: string }
                params: { type: object, additionalProperties: { type: string } }
    DigAxes:
      type: object
      required: [entity, axes]
      properties:
        entity: { $ref: '#/components/schemas/EntitySummary' }
        axes:
          type: array
          items:
            type: object
            required: [axis, group, count]
            properties:
              axis: { $ref: '#/components/schemas/DigAxis' }
              group: { type: string, enum: [people, history, sound, place] }
              count: { type: integer }
    DigConnection:
      type: object
      required: [entity, axis, via, evidence, popularity_tier, playability]
