        amount_minor: { type: integer, minimum: 1, description: Integer minor units (KRW has none) }
        currency: { type: string, enum: [KRW] }
        tax_minor: { type: integer, minimum: 0 }
        tax_included: { type: boolean }
    Offer:
      type: object
      required: [offer_id, release_id, territories, price, capabilities, status, version]
      properties:
        offer_id: { $ref: '#/components/schemas/Id' }
