        notes: { type: [string, 'null'], maxLength: 2000 }
        verification_state:
          type: string
          enum: [self_declared, evidence_reviewed]
          description: '`self_declared` until an operator reviews evidence; a record of ownership, not of rights (COL-002).'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PhysicalItemPage:
      type: object
