        barcode: { type: [string, 'null'], description: 'EAN-8, UPC-A, EAN-13 or GTIN-14 with a valid check digit' }
        catalog_number: { type: [string, 'null'], maxLength: 100 }
        release_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        notes: { type: [string, 'null'], maxLength: 2000 }
    UpdatePhysicalItemRequest:
      type: object
      additionalProperties: false
      properties:
        format: { $ref: '#/components/schemas/PhysicalFormat' }
        title: { type: string, minLength: 1, maxLength: 300 }
