          required: [owned, pending_order_id, terms, checkout_available]
          properties:
            owned: { type: boolean }
            pending_order_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
            checkout_available: { type: boolean }
            terms:
              type: object
              required: [terms_version, summary]
              properties:
                terms_version: { type: string }
                summary: { type: array, items: { type: string } }
    CreateOrderRequest:
      type: object
      additionalProperties: false
