    LibraryItem:
      type: object
      required: [library_item_id, ref_type, ref_id, origin, title, subtitle, note, saved_at, ownership, playability]
      properties:
        library_item_id: { $ref: '#/components/schemas/Id' }
        ref_type: { $ref: '#/components/schemas/LibraryRefType' }
        ref_id: { $ref: '#/components/schemas/Id' }
        origin: { type: string, enum: [uploaded, logged, saved] }
        title: { type: [string, 'null'] }
        subtitle: { type: [string, 'null'] }
        primary_release_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ], description: "Catalog recordings only: see EntitySummary.primary_release_id" }
        note: { type: [string, 'null'] }
        saved_at: { $ref: '#/components/schemas/Timestamp' }
        ownership: { type: string, enum: [private, audio_log, streaming, purchased, granted], description: Ownership/source status label (BRD Ownership Visible) }
        playability: { $ref: '#/components/schemas/Playability' }
    PhysicalFormat:
      type: string
      enum: [cd, vinyl, cassette, other]
    PhysicalItem:
      type: object
      required: [physical_item_id, format, title, artist_name, barcode, catalog_number, release, notes, verification_state, created_at, updated_at]
      properties:
        physical_item_id: { $ref: '#/components/schemas/Id' }
        format: { $ref: '#/components/schemas/PhysicalFormat' }
        title: { type: string, maxLength: 300 }
        artist_name: { type: [string, 'null'], maxLength: 300 }
        barcode: { type: [string, 'null'], pattern: '^[0-9]{8,14}$', description: 'EAN/UPC with a valid check digit' }
        catalog_number: { type: [string, 'null'], maxLength: 100 }
