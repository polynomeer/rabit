      properties:
        offer_id: { $ref: '#/components/schemas/Id' }
        confirm_already_owned: { type: boolean, default: false }
    Order:
      type: object
      required: [order_id, kind, status, offer_id, release_id, release_title, artist_names, plan, renewal, price, capabilities, terms_version, checkout_url, entitlement_id, created_at, expires_at, paid_at, refunded_at, version]
      properties:
        order_id: { $ref: '#/components/schemas/Id' }
        kind: { type: string, enum: [release, subscription] }
        status: { type: string, enum: [pending, paid, fulfilled, cancelled, expired, refund_pending, refunded] }
        offer_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ], description: Release orders only }
        release_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        release_title: { type: [string, 'null'] }
        artist_names: { type: array, items: { type: string } }
        plan: { type: [string, 'null'], description: Subscription orders only }
        renewal: { type: boolean, description: An automatic renewal charge }
        price: { $ref: '#/components/schemas/Money' }
        capabilities: { type: array, items: { type: string } }
        terms_version: { type: string }
        checkout_url: { type: [string, 'null'], description: Present while pending }
        entitlement_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        paid_at: { oneOf: [ { $ref: '#/components/schemas/Timestamp' }, { type: 'null' } ] }
        refunded_at: { oneOf: [ { $ref: '#/components/schemas/Timestamp' }, { type: 'null' } ] }
        version: { type: integer }
    OrderList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Order' } }
    OpsOrder:
      allOf:
        - { $ref: '#/components/schemas/Order' }
        - type: object
          required: [user_id, provider, events, refunds, ledger]
          properties:
            user_id: { $ref: '#/components/schemas/Id' }
            provider: { type: string }
            events: { type: array, items: { type: object, required: [payment_event_id, type, status], properties: { payment_event_id: { type: string }, type: { type: string }, status: { type: string, enum: [received, applied, ignored, held] }, detail: { type: [string, 'null'] } } } }
            refunds: { type: array, items: { type: object, required: [refund_id, status, amount_minor], properties: { refund_id: { type: string }, status: { type: string, enum: [requested, succeeded, failed] }, amount_minor: { type: integer } } } }
            ledger: { type: array, items: { type: object, required: [journal_id, kind, account, debit_minor, credit_minor], properties: { journal_id: { type: string }, kind: { type: string, enum: [sale, refund] }, account: { type: string, enum: [provider_clearing, revenue, vat_payable] }, debit_minor: { type: integer }, credit_minor: { type: integer } } } }
    CreateOfferRequest:
      type: object
      additionalProperties: false
      required: [release_id, territories, price_minor, reason]
      properties:
        release_id: { $ref: '#/components/schemas/Id' }
        territories: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/Country' } }
        price_minor: { type: integer, minimum: 100, maximum: 10000000 }
        vat_rate_bp: { type: integer, minimum: 0, maximum: 10000, default: 1000 }
        reason: { $ref: '#/components/schemas/Reason' }
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { $ref: '#/components/schemas/Reason' }
    SubscriptionPlan:
