      required: [plan, period, price, available, checkout_available, current, pending_order_id, terms_version]
      properties:
        plan: { type: string }
        period: { type: string, enum: [P1M] }
        price: { $ref: '#/components/schemas/Money' }
        available: { type: boolean, description: The caller's region can subscribe }
        checkout_available: { type: boolean }
        current:
          oneOf:
            - { type: 'null' }
            - type: object
              required: [state, paid_through, auto_renew]
              properties:
                state: { type: string, enum: [active, past_due, cancelled, expired] }
                paid_through: { $ref: '#/components/schemas/Timestamp' }
                auto_renew: { type: boolean }
        pending_order_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        terms_version: { type: string }
    MockCheckout:
      type: object
      required: [checkout_ref, order_id, amount_minor, currency, status, provider]
      properties:
        checkout_ref: { type: string }
        order_id: { type: string }
        amount_minor: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [open, succeeded, failed, refunded] }
        provider: { type: string }
        signature_header: { type: string }
    Entitlement:
      type: object
      required: [entitlement_id, scope, resource_id, capabilities, origin, status, valid_from, valid_to, version]
      properties:
        entitlement_id: { $ref: '#/components/schemas/Id' }
        scope: { type: string, enum: [catalog_all, release, recording] }
        resource_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
        capabilities: { type: array, items: { type: string } }
        origin: { type: string, enum: [subscription, purchase, grant] }
        status: { type: string, enum: [active, suspended, revoked, expired] }
        valid_from: { $ref: '#/components/schemas/Timestamp' }
        valid_to: { oneOf: [ { $ref: '#/components/schemas/Timestamp' }, { type: 'null' } ] }
        version: { type: integer }
    EntitlementList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Entitlement' } }
    Subscription:
      type: object
      required: [subscription_id, plan, state, paid_through, source]
      properties:
        subscription_id: { $ref: '#/components/schemas/Id' }
        plan: { type: string }
        state: { type: string, enum: [active, past_due, cancelled, expired] }
        paid_through: { $ref: '#/components/schemas/Timestamp' }
        source: { type: string, enum: [operator, sandbox] }
        auto_renew: { type: boolean, description: Renews through the payment provider (sandbox) until stopped }
    SubscriptionEnvelope:
      type: object
      required: [subscription]
      properties:
        subscription: { oneOf: [ { $ref: '#/components/schemas/Subscription' }, { type: 'null' } ] }

    DigAxis:
      type: string
      enum: [credits, same_producer, session_musicians, same_label, samples, sampled_by, covers, covered_by, remixes, remix_of, influences, influenced_by, members, member_of, releases, tracks, artists]
    PopularityFilter:
      type: string
      enum: [any, below_top_50, deep_cuts, obscure]
      default: any
    Evidence:
      type: object
      required: [basis, verification_state, source, confidence, license_status, explanation, reason]
      properties:
        basis: { type: string, enum: [verified_fact, declared, ml_inferred] }
        verification_state: { type: string }
        source: { type: string }
        confidence: { type: [number, 'null'] }
        license_status: { type: [string, 'null'], enum: [null, unknown, licensed, not_applicable] }
        explanation: { type: string, description: 'English sentence, for example "Same producer: X". Kept for existing clients; localized clients render `reason`.' }
        reason:
          description: >-
            The same reason as a code plus values, so clients render it in their own
            language. Null on trail nodes stored before codes existed (fall back to
            `explanation`). Codes: relation.<axis> (subject, object), credit (role,
            name, instrument?), credited_as (role, name), same_producer (name),
            same_session_player (name, instrument?), main_artist, on_release,
            recording_by_artist, appears_on, released_on_label, release_by_artist,
            same_label (name). `role` is a credit role code. Clients show
            `explanation` for codes they do not know.
          oneOf:
            - type: 'null'
            - type: object
              required: [code, params]
              properties:
                code: { type: string }
                params: { type: object, additionalProperties: { type: string } }
    LabelTimeline:
      type: object
      required: [label, years, artists, truncated]
      properties:
        label: { $ref: '#/components/schemas/EntitySummary' }
        years:
          type: array
          items:
            type: object
            required: [year, releases]
            properties:
              year: { type: [integer, 'null'], description: 'null for undated releases' }
              releases:
                type: array
                items:
                  type: object
                  required: [release_id, title, release_type, release_date, artists]
                  properties:
                    release_id: { $ref: '#/components/schemas/Id' }
                    title: { type: string }
                    release_type: { type: string, enum: [album, single, ep, compilation] }
                    release_date: { type: [string, 'null'], format: date }
                    artists: { type: array, items: { $ref: '#/components/schemas/EntitySummary' } }
        artists:
          type: array
          items:
            type: object
            required: [artist, first_year, last_year, releases]
            properties:
              artist: { $ref: '#/components/schemas/EntitySummary' }
              first_year: { type: [integer, 'null'] }
              last_year: { type: [integer, 'null'] }
              releases: { type: integer }
        truncated: { type: boolean }
    StartBlindDigRequest:
      type: object
      additionalProperties: false
      properties:
        start_entity_id: { $ref: '#/components/schemas/Id' }
        popularity: { $ref: '#/components/schemas/PopularityFilter' }
    BlindDig:
      type: object
      required: [blind_dig_id, popularity, created_at, items]
      properties:
        blind_dig_id: { $ref: '#/components/schemas/Id' }
        popularity: { $ref: '#/components/schemas/PopularityFilter' }
        created_at: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [item_id, position, recording_id, decision, reveal]
            properties:
              item_id: { $ref: '#/components/schemas/Id' }
              position: { type: integer }
              recording_id: { $ref: '#/components/schemas/Id' }
              decision: { type: [string, 'null'], enum: [keep, pass, null] }
              reveal:
                description: Null until decided.
                oneOf:
                  - type: 'null'
                  - type: object
                    required: [recording, release, popularity_tier]
                    properties:
                      recording: { $ref: '#/components/schemas/EntitySummary' }
                      release:
                        oneOf:
                          - type: 'null'
                          - type: object
                            required: [release_id, title, release_date]
                            properties:
                              release_id: { $ref: '#/components/schemas/Id' }
                              title: { type: string }
                              release_date: { type: [string, 'null'], format: date }
                      popularity_tier: { type: string }
    Crate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [release, artists, label, playable_tracks, popularity_tier]
            properties:
              release:
                type: object
                required: [release_id, title, release_type, release_date]
                properties:
                  release_id: { $ref: '#/components/schemas/Id' }
                  title: { type: string }
                  release_type: { type: string, enum: [album, single, ep, compilation] }
                  release_date: { type: [string, 'null'], format: date }
              artists: { type: array, items: { $ref: '#/components/schemas/EntitySummary' } }
              label: { oneOf: [ { type: 'null' }, { $ref: '#/components/schemas/EntitySummary' } ] }
              playable_tracks: { type: integer, minimum: 1 }
              popularity_tier: { type: string }
    DigAxes:
      type: object
      required: [entity, axes]
      properties:
        entity: { $ref: '#/components/schemas/EntitySummary' }
        axes:
          type: array
          items:
            type: object
            required: [axis, group, count]
            properties:
              axis: { $ref: '#/components/schemas/DigAxis' }
              group: { type: string, enum: [people, history, sound, place] }
              count: { type: integer }
    DigConnection:
      type: object
      required: [entity, axis, via, evidence, popularity_tier, playability]
      properties:
        entity: { $ref: '#/components/schemas/EntitySummary' }
        axis: { $ref: '#/components/schemas/DigAxis' }
        via:
          type: object
          required: [relation_id, credit_id]
          properties:
            relation_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
            credit_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ] }
            via_entity: { oneOf: [ { $ref: '#/components/schemas/EntitySummary' }, { type: 'null' } ] }
        evidence: { $ref: '#/components/schemas/Evidence' }
        popularity_tier: { type: string, enum: [top, upper, deep_cut, obscure, unknown] }
        playability: { oneOf: [ { $ref: '#/components/schemas/Playability' }, { type: 'null' } ] }
    DigConnectionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DigConnection' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }
    StartDigSessionRequest:
      type: object
      additionalProperties: false
      description: Exactly one of entity_id or audio_source_id.
      properties:
        entity_id: { $ref: '#/components/schemas/Id' }
        audio_source_id: { $ref: '#/components/schemas/Id' }
    AddDigStepRequest:
      type: object
      additionalProperties: false
      required: [entity_id, axis]
      properties:
        from_seq: { type: integer, minimum: 0, description: Defaults to the session cursor }
        entity_id: { $ref: '#/components/schemas/Id' }
        axis: { $ref: '#/components/schemas/DigAxis' }
        relation_id: { $ref: '#/components/schemas/Id' }
        credit_id: { $ref: '#/components/schemas/Id' }
    UpdateDigSessionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: [string, 'null'], maxLength: 200 }
        saved: { type: boolean }
    DigTrailNode:
      type: object
      required: [seq, parent_seq, entity, via_axis, evidence, played, saved, created_at]
      properties:
        seq: { type: integer }
        parent_seq: { type: [integer, 'null'] }
        entity: { $ref: '#/components/schemas/EntitySummary' }
        via_axis: { oneOf: [ { $ref: '#/components/schemas/DigAxis' }, { type: 'null' } ] }
        evidence: { oneOf: [ { $ref: '#/components/schemas/Evidence' }, { type: 'null' } ] }
        played: { type: boolean }
        saved: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    DigSession:
      type: object
      required: [dig_session_id, state, title, saved, visibility, current_seq, empty_state, trail, started_at, ended_at, summary]
      properties:
        dig_session_id: { $ref: '#/components/schemas/Id' }
        state: { type: string, enum: [active, ended] }
        title: { type: [string, 'null'] }
        saved: { type: boolean }
        visibility: { type: string, enum: [private] }
        current_seq: { type: integer }
        empty_state:
          oneOf:
            - type: 'null'
            - type: object
              required: [reason, message]
              properties:
                reason: { type: string, enum: [no_catalog_link, no_connections] }
                message: { type: string }
        trail: { type: array, items: { $ref: '#/components/schemas/DigTrailNode' } }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        ended_at: { oneOf: [ { $ref: '#/components/schemas/Timestamp' }, { type: 'null' } ] }
        summary:
          type: object
          required: [nodes, distinct_artists, axes_used, played, saved]
          properties:
            nodes: { type: integer }
            distinct_artists: { type: integer }
            axes_used: { type: array, items: { type: string } }
            played: { type: integer }
            saved: { type: integer }
    DigSessionSummary:
      type: object
      required: [dig_session_id, title, saved, state, start_entity, nodes, started_at]
      properties:
        dig_session_id: { $ref: '#/components/schemas/Id' }
        title: { type: [string, 'null'] }
        saved: { type: boolean }
        state: { type: string, enum: [active, ended] }
        start_entity: { oneOf: [ { $ref: '#/components/schemas/EntitySummary' }, { type: 'null' } ] }
        nodes: { type: integer }
        started_at: { $ref: '#/components/schemas/Timestamp' }
    DigSessionSummaryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DigSessionSummary' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    SearchResult:
      type: object
      required: [kind, id, title, subtitle, match, scope]
      properties:
        kind: { type: string, enum: [recording, release, artist, person, label, private_audio, audio_log] }
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        match: { type: string, enum: [exact, text, fuzzy] }
        scope: { type: string, enum: [catalog, mine] }
        primary_release_id: { oneOf: [ { $ref: '#/components/schemas/Id' }, { type: 'null' } ], description: "kind=recording only: see EntitySummary.primary_release_id" }
    SearchPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SearchResult' } }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    CreateReportRequest:
      type: object
      additionalProperties: false
      required: [subject_type, subject_id, reason_code]
      properties:
        subject_type: { type: string, enum: [recording, release, artist, relation, credit] }
        subject_id: { $ref: '#/components/schemas/Id' }
        reason_code: { type: string, enum: [wrong_credit, wrong_relation, undisclosed_ai, spam, impersonation, rights_infringement, other] }
        details: { type: string, maxLength: 2000 }
    Report:
      type: object
      required: [report_id, status, created_at]
      properties:
        report_id: { $ref: '#/components/schemas/Id' }
        status: { type: string, enum: [received, triaged, actioned, dismissed] }
        created_at: { $ref: '#/components/schemas/Timestamp' }

    CreateRightsGrantRequest:
      type: object
      additionalProperties: false
      required: [recording_id, rights_holder, territories, uses, valid_from, contract_ref, reason]
      properties:
        recording_id: { $ref: '#/components/schemas/Id' }
        rights_holder: { type: string, minLength: 1, maxLength: 200 }
        territories: { type: array, minItems: 1, items: { type: string, pattern: '^([A-Z]{2}|WORLD)$' } }
        uses: { type: array, minItems: 1, items: { type: string, enum: [stream, download, preview, transform, stem, analysis] } }
        valid_from: { $ref: '#/components/schemas/Timestamp' }
        valid_to: { $ref: '#/components/schemas/Timestamp' }
        contract_ref: { type: string, minLength: 1, maxLength: 200 }
        reason: { $ref: '#/components/schemas/Reason' }
    RightsGrant:
      type: object
      required: [rights_grant_id, recording_id, rights_holder, territories, uses, valid_from, valid_to, status, contract_ref, version]
      properties:
        rights_grant_id: { $ref: '#/components/schemas/Id' }
        recording_id: { $ref: '#/components/schemas/Id' }
        rights_holder: { type: string }
        territories: { type: array, items: { type: string } }
        uses: { type: array, items: { type: string } }
        valid_from: { $ref: '#/components/schemas/Timestamp' }
        valid_to: { oneOf: [ { $ref: '#/components/schemas/Timestamp' }, { type: 'null' } ] }
        status: { type: string, enum: [active, suspended, revoked, expired] }
        contract_ref: { type: string }
        version: { type: integer }
    ChangeStatusRequest:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status: { type: string, enum: [active, suspended, revoked] }
        reason: { $ref: '#/components/schemas/Reason' }
    GrantEntitlementRequest:
      type: object
      additionalProperties: false
      required: [user_id, scope, capabilities, reason]
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        scope: { type: string, enum: [release, recording] }
        resource_id: { $ref: '#/components/schemas/Id' }
        capabilities: { type: array, minItems: 1, items: { type: string, enum: [play] } }
        valid_to: { $ref: '#/components/schemas/Timestamp' }
        reason: { $ref: '#/components/schemas/Reason' }
    SetSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [state, paid_through, reason]
      properties:
        plan: { type: string, default: listen_sandbox }
        state: { type: string, enum: [active, past_due, cancelled, expired] }
        paid_through: { $ref: '#/components/schemas/Timestamp' }
        reason: { $ref: '#/components/schemas/Reason' }
    Job:
      type: object
      required: [job_id, kind, status, attempts, max_attempts, last_error, created_at, updated_at]
      properties:
        job_id: { $ref: '#/components/schemas/Id' }
        kind: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, dead] }
        attempts: { type: integer }
        max_attempts: { type: integer }
        last_error: { type: [string, 'null'] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    JobList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Job' } }
