# Local development and test infrastructure (ADR-0003, ADR-0004, ADR-0012).
# Ports are offset to avoid clashing with other local stacks.
name: rabit

services:
  postgres:
    image: postgres:16-alpine
    pull_policy: missing
    environment:
      POSTGRES_USER: rabit
      POSTGRES_PASSWORD: rabit
      POSTGRES_DB: rabit
    ports:
      - '127.0.0.1:55440:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rabit -d rabit']
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    # S3-compatible object storage for local development and tests (ADR-0004).
    # SeaweedFS replaced MinIO, whose images were withdrawn from public registries.
    image: chrislusf/seaweedfs:4.47
    pull_policy: missing
    command: >-
      server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=64 -volume.max=0
    environment:
      # Dev-only key so SSE-S3 (requested on every PUT, ADR-0004) works locally.
      WEED_S3_SSE_KEY: rabit-dev-only-sse-key
    ports:
      - '127.0.0.1:59000:8333'
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8333/healthz']
      interval: 2s
      timeout: 3s
      retries: 60

  s3-init:
    # The server image ships `weed shell`, so no extra image is needed.
    image: chrislusf/seaweedfs:4.47
    pull_policy: missing
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/init/create-buckets.sh', 's3:9333']
    volumes:
      - ./infra/seaweedfs:/init:ro
    restart: 'no'

volumes:
  pgdata:
  s3data:
