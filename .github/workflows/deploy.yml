# Manual deploy to AWS Seoul (ADR-0012). Credentials come from GitHub OIDC; the
# GitHub environment holds the variables below and its protection rules (e.g.
# required reviewers for production) gate the job.
name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read
  id-token: write
  actions: read # to check that CI passed for the commit being deployed

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    # Fargate tasks run on ARM64 (ADR-0012); build natively on an ARM runner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ENVIRONMENT: ${{ inputs.environment }}
      IMAGE: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
      OPS_SUBNETS: ${{ vars.OPS_SUBNETS }}
      OPS_SECURITY_GROUP: ${{ vars.OPS_SECURITY_GROUP }}
    steps:
      # Only commits that passed CI are deployed; production only from main.
      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          if [ "$ENVIRONMENT" = production ] && [ "$REF" != refs/heads/main ]; then
            echo "production deploys only from main (got $REF)" >&2; exit 1
          fi
          ok=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" \
            --status success --json databaseId --jq 'length')
          if [ "$ok" = 0 ]; then
            echo "no successful CI run for $SHA; wait for CI or fix it first" >&2; exit 1
          fi
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push the image
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Migrate and roll out api, media, worker and transcoder
        run: infra/aws/scripts/deploy.sh
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Build and publish the web client
        env:
          VITE_API_BASE: ${{ vars.API_BASE_URL }}
          VITE_OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
          VITE_OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
          VITE_OIDC_OPERATOR_ISSUER: ${{ vars.OIDC_OPERATOR_ISSUER }}
          VITE_OIDC_OPERATOR_CLIENT_ID: ${{ vars.OIDC_OPERATOR_CLIENT_ID }}
          VITE_OIDC_AUDIENCE: ${{ vars.OIDC_AUDIENCE }}
        run: |
          pnpm install --frozen-lockfile --filter @rabit/web...
          pnpm --filter @rabit/web build
          infra/aws/scripts/publish-web.sh apps/web/dist "${{ vars.WEB_BUCKET }}" "${{ vars.WEB_DISTRIBUTION_ID }}"
      # Maps reported web stack frames to the source (runbooks#client-diagnostics).
      - name: Keep the source maps
        uses: actions/upload-artifact@v7
        with:
          name: web-sourcemaps-${{ github.sha }}
          path: apps/web/dist/assets/*.map
          retention-days: 90
      - name: Post-deploy checks
        env:
          API_URL: ${{ vars.API_BASE_URL }}
          APP_URL: ${{ vars.APP_URL }}
          MEDIA_URL: ${{ vars.MEDIA_URL }}
          MEDIA_ORIGIN_URL: ${{ vars.MEDIA_ORIGIN_URL }}
        run: infra/aws/scripts/smoke.sh
