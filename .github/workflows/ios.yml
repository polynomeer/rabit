name: ios

# The iOS client (ADR-0023). Runs only when it changes; macOS runners are free for
# this public repository.
on:
  push:
    branches: [main]
    paths: ['apps/ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['apps/ios/**', '.github/workflows/ios.yml']

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: RabitKit tests (macOS)
        run: swift test --package-path apps/ios/Packages/RabitKit
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec apps/ios/project.yml
      - name: Build and test the app (iOS Simulator)
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS-26")) | .value[]
                      | select(.name | startswith("iPhone"))][0].udid')
          echo "simulator: $udid"
          xcodebuild test -quiet -project apps/ios/Rabit.xcodeproj -scheme Rabit \
            -destination "id=$udid" CODE_SIGNING_ALLOWED=NO
