name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rabit
          POSTGRES_PASSWORD: rabit
          POSTGRES_DB: rabit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rabit -d rabit_test" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://rabit:rabit@127.0.0.1:5432/rabit_test
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@v7
      - name: Start SeaweedFS (S3) with SSE-S3 enabled
        run: |
          docker run -d --name s3 -p 9000:8333 \
            -e WEED_S3_SSE_KEY=rabit-dev-only-sse-key \
            -v "$PWD/infra/seaweedfs:/init:ro" \
            chrislusf/seaweedfs:4.47 server -dir=/data -s3 -s3.port=8333 \
            -s3.config=/init/s3.json -master.volumeSizeLimitMB=64 -volume.max=0
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:9000/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:9000/healthz
          docker exec s3 sh /init/create-buckets.sh localhost:9333
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@1 lint docs/05-api/openapi.yaml
      - name: Alert rules (promtool check and unit tests)
        run: pnpm alerts:check

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rabit
          POSTGRES_PASSWORD: rabit
          POSTGRES_DB: rabit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rabit -d rabit" --health-interval 2s --health-retries 30
    env:
      E2E_PG_URL: postgres://rabit:rabit@127.0.0.1:5432
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@v7
      - name: Start SeaweedFS (S3) with SSE-S3 enabled
        run: |
          docker run -d --name s3 -p 9000:8333 \
            -e WEED_S3_SSE_KEY=rabit-dev-only-sse-key \
            -v "$PWD/infra/seaweedfs:/init:ro" \
            chrislusf/seaweedfs:4.47 server -dir=/data -s3 -s3.port=8333 \
            -s3.config=/init/s3.json -master.volumeSizeLimitMB=64 -volume.max=0
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:9000/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:9000/healthz
          docker exec s3 sh /init/create-buckets.sh localhost:9333
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @rabit/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Upload E2E report and stack log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: apps/web/e2e-results/
          retention-days: 7

  image:
    # The deployable image is built and started here; dependency bumps of the
    # base image (Dependabot) are otherwise never exercised by CI.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rabit
          POSTGRES_PASSWORD: rabit
          POSTGRES_DB: rabit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rabit -d rabit" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the server image
        run: docker build -t rabit-server:ci .
      - name: Check the image runs as non-root with ffmpeg
        run: |
          test "$(docker run --rm --entrypoint id rabit-server:ci -u)" = "10001"
          docker run --rm --entrypoint ffmpeg rabit-server:ci -version | head -1
      - name: Run migrations and start the api from the image
        run: |
          cat > image.env <<'ENV'
          NODE_ENV=development
          API_PUBLIC_BASE_URL=http://localhost:8080
          MEDIA_PUBLIC_BASE_URL=http://localhost:8081
          DATABASE_URL=postgres://rabit:rabit@127.0.0.1:5432/rabit
          S3_ENDPOINT=http://127.0.0.1:9000
          S3_ACCESS_KEY_ID=ci
          S3_SECRET_ACCESS_KEY=ci-secret
          S3_FORCE_PATH_STYLE=true
          AUTH_ISSUER=http://localhost:8080/dev
          AUTH_AUDIENCE=rabit-api
          AUTH_DEV_ISSUER_ENABLED=true
          MEDIA_TOKEN_SECRET=ci-only-media-token-secret-0123456789abcdef
          CURSOR_SECRET=ci-only-cursor-secret-0123456789abcdefghij
          ENV
          docker run --rm --network host --env-file image.env rabit-server:ci migrate up
          docker run -d --name api --network host --env-file image.env rabit-server:ci api
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/healthz
      - name: Api logs
        if: failure()
        run: docker logs api || true

  infra:
    # AWS infrastructure code (ADR-0012): formatting and validation without credentials.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: OpenTofu fmt and validate
        run: |
          tofu() { docker run --rm -v "$PWD/infra/aws:/w" -w /w ghcr.io/opentofu/opentofu:1.12.7 "$@"; }
          tofu fmt -recursive -check -diff
          tofu init -backend=false -input=false
          tofu validate
      - name: Shell scripts
        run: shellcheck infra/aws/scripts/*.sh
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency vulnerability scan
        run: pnpm audit --prod --audit-level high
