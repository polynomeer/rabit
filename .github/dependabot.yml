version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # The AWS SDK packages share internal types: bumping one alone breaks the
    # typecheck (S3Client vs the presigner), so they move together.
    groups:
      aws-sdk:
        patterns: ['@aws-sdk/*']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  # OpenTofu providers (infra/aws/.terraform.lock.hcl); CI re-runs tofu init/validate/test.
  - package-ecosystem: terraform
    directory: /infra/aws
    schedule: { interval: weekly }
