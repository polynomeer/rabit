# Prometheus alerting rules (proposals, docs/09-operations/slo.md).
# Every alert states the user impact and links a runbook section.
groups:
  - name: rabit-user-impact
    rules:
      - alert: ApiAvailabilityFastBurn
        expr: |
          (sum(rate(rabit_http_request_duration_seconds_count{service="api",status_class="5xx"}[5m]))
            / sum(rate(rabit_http_request_duration_seconds_count{service="api"}[5m]))) > (14.4 * 0.001)
          and
          (sum(rate(rabit_http_request_duration_seconds_count{service="api",status_class="5xx"}[1h]))
            / sum(rate(rabit_http_request_duration_seconds_count{service="api"}[1h]))) > (14.4 * 0.001)
        labels: { severity: page }
        annotations:
          impact: Users see errors when opening the app, their library or starting playback.
          runbook: docs/09-operations/runbooks.md#api-errors

      - alert: PlaybackCannotStart
        expr: |
          sum(rate(rabit_http_request_duration_seconds_count{service="api",route="/v1/playback-sessions",status_class="5xx"}[5m]))
            / sum(rate(rabit_http_request_duration_seconds_count{service="api",route="/v1/playback-sessions"}[5m])) > 0.005
        for: 5m
        labels: { severity: page }
        annotations:
          impact: Users press play and nothing starts.
          runbook: docs/09-operations/runbooks.md#playback-failures

      - alert: MediaDeliveryErrors
        expr: |
          sum(rate(rabit_media_requests_total{outcome="missing"}[10m])) > 0.1
        for: 10m
        labels: { severity: ticket }
        annotations:
          impact: Playback stops mid-track because segments are missing.
          runbook: docs/09-operations/runbooks.md#playback-failures

      - alert: UploadsStuck
        expr: rabit_job_oldest_queued_seconds > 900
        for: 5m
        labels: { severity: page }
        annotations:
          impact: New uploads and Audio Logs stay "processing"; deletions and revocations are delayed.
          runbook: docs/09-operations/runbooks.md#queue-backlog

      - alert: RevocationLagging
        expr: rabit_outbox_pending > 500 or rabit_job_oldest_queued_seconds > 60
        for: 2m
        labels: { severity: page }
        annotations:
          impact: Rights withdrawals and subscription changes may not stop active sessions within 60 s (contract risk).
          runbook: docs/09-operations/runbooks.md#rights-revocation-not-applied

      - alert: DeadLetterGrowth
        expr: increase(rabit_jobs_total{outcome="dead"}[1h]) > 20
        labels: { severity: ticket }
        annotations:
          impact: Some uploads failed for non-user reasons and need an operator retry.
          runbook: docs/09-operations/runbooks.md#dead-letter-queue

      - alert: SearchSlow
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(rabit_http_request_duration_seconds_bucket{route="/v1/search"}[10m]))) > 0.5
        for: 15m
        labels: { severity: ticket }
        annotations:
          impact: Search feels slow.
          runbook: docs/09-operations/runbooks.md#slow-queries

      - alert: ListeningEventRejectionsSpike
        expr: |
          sum(rate(rabit_listening_events_total{outcome="rejected"}[15m]))
            / sum(rate(rabit_listening_events_total[15m])) > 0.2
        for: 15m
        labels: { severity: ticket }
        annotations:
          impact: Possible stream manipulation or a client bug; Deep Cut popularity may be distorted.
          runbook: docs/09-operations/runbooks.md#listening-anomalies

      - alert: RateLimitStoreFailing
        expr: sum(rate(rabit_rate_limit_store_errors_total[5m])) > 0
        for: 5m
        labels: { severity: ticket }
        annotations:
          impact: API rate limits are not enforced (fail-open, ADR-0020); abuse limits such as uploads and reports are open.
          runbook: docs/09-operations/runbooks.md#rate-limit-store
