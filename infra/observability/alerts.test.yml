# promtool unit tests for alerts.yml (R8): each case feeds synthetic series and
# states which alerts must fire. Run: see .github/workflows/ci.yml (alerts step).
rule_files:
  - alerts.yml
evaluation_interval: 1m
tests:
  - name: revocation lag pages when the queue stalls
    interval: 1m
    input_series:
      - series: 'rabit_job_oldest_queued_seconds{kind="playback.revoke_for_source"}'
        values: '0 0 120x5'
      # A transcoding backlog alone never pages for revocations.
      - series: 'rabit_job_oldest_queued_seconds{kind="audio.process"}'
        values: '0 0 600x5'
      - series: rabit_outbox_pending
        values: '0x7'
    alert_rule_test:
      - eval_time: 3m
        alertname: RevocationLagging
        exp_alerts: []
      - eval_time: 5m
        alertname: RevocationLagging
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations:
              impact: Rights withdrawals and subscription changes may not stop active sessions within 60 s (contract risk).
              runbook: docs/09-operations/runbooks.md#rights-revocation-not-applied

  - name: api fast burn pages on a sustained 5xx share
    interval: 1m
    input_series:
      # 100 req/min, 5 of them 5xx (5 % > 1.44 %), for more than an hour.
      - series: 'rabit_http_request_duration_seconds_count{service="api",status_class="2xx",route="/v1/me",method="GET"}'
        values: '0+95x70'
      - series: 'rabit_http_request_duration_seconds_count{service="api",status_class="5xx",route="/v1/me",method="GET"}'
        values: '0+5x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: ApiAvailabilityFastBurn
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations:
              impact: Users see errors when opening the app, their library or starting playback.
              runbook: docs/09-operations/runbooks.md#api-errors

  - name: api fast burn stays quiet under budget
    interval: 1m
    input_series:
      - series: 'rabit_http_request_duration_seconds_count{service="api",status_class="2xx",route="/v1/me",method="GET"}'
        values: '0+999x70'
      - series: 'rabit_http_request_duration_seconds_count{service="api",status_class="5xx",route="/v1/me",method="GET"}'
        values: '0+1x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: ApiAvailabilityFastBurn
        exp_alerts: []

  - name: rate-limit store failures open a ticket after 5 minutes
    interval: 1m
    input_series:
      - series: rabit_rate_limit_store_errors_total
        values: '0+3x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: RateLimitStoreFailing
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              impact: API rate limits are not enforced (fail-open, ADR-0020); abuse limits such as uploads and reports are open.
              runbook: docs/09-operations/runbooks.md#rate-limit-store

  - name: dead letters open a ticket
    interval: 1m
    input_series:
      - series: 'rabit_jobs_total{kind="audio.process_source",outcome="dead"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: DeadLetterGrowth
        exp_alerts:
          # Counted per job kind, so the alert names the failing kind.
          - exp_labels: { severity: ticket, kind: audio.process_source, outcome: dead }
            exp_annotations:
              impact: Some uploads failed for non-user reasons and need an operator retry.
              runbook: docs/09-operations/runbooks.md#dead-letter-queue

  - name: a catalog ingest backlog opens a ticket but pages nobody
    interval: 1m
    input_series:
      - series: 'rabit_job_oldest_queued_seconds{kind="catalog.process"}'
        values: '30000x40'
      - series: 'rabit_job_oldest_queued_seconds{kind="audio.process"}'
        values: '0x40'
      - series: rabit_outbox_pending
        values: '0x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: CatalogIngestBacklog
        exp_alerts:
          - exp_labels: { severity: ticket, kind: catalog.process }
            exp_annotations:
              impact: Newly delivered catalog recordings stay unavailable for more than 6 hours.
              runbook: docs/09-operations/runbooks.md#queue-backlog
      - eval_time: 35m
        alertname: UploadsStuck
        exp_alerts: []
      - eval_time: 35m
        alertname: RevocationLagging
        exp_alerts: []

  - name: slow starts and rebuffering open tickets once there is enough playback
    interval: 1m
    input_series:
      # 6 starts a minute, all slower than 3 s.
      - series: 'rabit_playback_startup_seconds_bucket{platform="web",le="2"}'
        values: '0x70'
      - series: 'rabit_playback_startup_seconds_bucket{platform="web",le="3"}'
        values: '0x70'
      - series: 'rabit_playback_startup_seconds_bucket{platform="web",le="5"}'
        values: '0+6x70'
      - series: 'rabit_playback_startup_seconds_bucket{platform="web",le="+Inf"}'
        values: '0+6x70'
      - series: 'rabit_playback_startup_seconds_count{platform="web"}'
        values: '0+6x70'
      # 600 s played and 6 s stalled a minute: 1 %.
      - series: 'rabit_playback_played_seconds_total{platform="web"}'
        values: '0+600x70'
      - series: 'rabit_playback_stall_seconds_total{platform="web"}'
        values: '0+6x70'
      - series: 'rabit_playback_quality_reports_total{platform="web",outcome="accepted"}'
        values: '0+6x70'
      - series: 'rabit_playback_client_errors_total{platform="web",code="network"}'
        values: '0x70'
    alert_rule_test:
      - eval_time: 65m
        alertname: PlaybackStartSlow
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              impact: Listeners wait more than 2 s for sound (p95, slo.md).
              runbook: docs/09-operations/runbooks.md#playback-quality
      - eval_time: 65m
        alertname: RebufferingHigh
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              impact: Playback stalls more than 0.5 % of the time (slo.md).
              runbook: docs/09-operations/runbooks.md#playback-quality
      - eval_time: 65m
        alertname: PlaybackErrorsHigh
        exp_alerts: []

  - name: missing worker metrics page after 5 minutes
    interval: 1m
    input_series:
      - series: rabit_job_oldest_queued_seconds
        values: '0 0 _x20'
    alert_rule_test:
      # The last sample still counts for the 5 m lookback, then 5 m of `for`.
      - eval_time: 8m
        alertname: QueueMetricsMissing
        exp_alerts: []
      - eval_time: 15m
        alertname: QueueMetricsMissing
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations:
              impact: No worker is reporting; uploads, deletions and rights revocations may have stopped.
              runbook: docs/09-operations/runbooks.md#queue-backlog

  - name: held payments open a ticket
    interval: 1m
    input_series:
      - series: 'rabit_payment_events_total{provider="app_store",type="DID_RENEW",outcome="held"}'
        values: '0 0 1 1 1'
      - series: 'rabit_payment_reconcile_mismatches_total{kind="payment_not_recorded"}'
        values: '0 0 0 0 0'
    alert_rule_test:
      - eval_time: 4m
        alertname: PaymentEventsHeld
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              impact: A payment, refund or App Store notification could not be applied; a customer may have paid without access or lost access they paid for.
              runbook: docs/09-operations/runbooks.md#payments-held
      - eval_time: 4m
        alertname: PaymentReconcileMismatch
        exp_alerts: []
