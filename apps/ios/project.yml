# XcodeGen spec for the iOS client (ADR-0023). Generate the project with
#   xcodegen generate --spec apps/ios/project.yml
# The generated Rabit.xcodeproj is not committed.
name: Rabit
options:
  bundleIdPrefix: app.rabit
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  RabitKit:
    path: Packages/RabitKit
targets:
  Rabit:
    type: application
    platform: iOS
    sources: [Rabit]
    dependencies:
      - package: RabitKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rabit.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rabit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Provider sign-in (`tofu output ios_oidc`); empty: not configured.
        RABIT_OIDC_ISSUER: ''
        RABIT_OIDC_CLIENT_ID: ''
      configs:
        Debug:
          RABIT_API_BASE_URL: http://localhost:8080
        Release:
          RABIT_API_BASE_URL: ''
    info:
      path: Config/Rabit-Info.plist
      properties:
        RabitAPIBaseURL: $(RABIT_API_BASE_URL)
        RabitOIDCIssuer: $(RABIT_OIDC_ISSUER)
        RabitOIDCClientID: $(RABIT_OIDC_CLIENT_ID)
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: 지금 이 자리의 소리를 Audio Log로 녹음해요. 녹음은 비공개로 저장돼요.
        ITSAppUsesNonExemptEncryption: false
        # Plain HTTP only to localhost (local stack); everything else needs TLS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  RabitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RabitTests]
    dependencies:
      - target: Rabit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.rabit.ios.tests
  # Drives the app in the simulator against canned answers (FixtureTransport).
  RabitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RabitUITests]
    dependencies:
      - target: Rabit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.rabit.ios.uitests
        TEST_TARGET_NAME: Rabit
        # XCTestCase's initializers are nonisolated; the test methods opt into MainActor.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  Rabit:
    build:
      targets:
        Rabit: all
        RabitTests: [test]
        RabitUITests: [test]
    run:
      config: Debug
      # Local StoreKit testing; run the api with APP_STORE_ENVIRONMENT=Xcode (ADR-0024).
      storeKitConfiguration: Rabit/Rabit.storekit
      environmentVariables:
        # Change when the local API runs on another port (RABIT_API_PORT).
        - variable: RABIT_API_BASE
          value: http://localhost:8080
          isEnabled: true
        # Enable both to sign in through the local mock provider (docker compose --profile oidc).
        - variable: RABIT_OIDC_ISSUER
          value: http://localhost:8090/rabit
          isEnabled: false
        - variable: RABIT_OIDC_CLIENT_ID
          value: rabit-ios
          isEnabled: false
    test:
      config: Debug
      targets:
        - RabitTests
        - RabitUITests
